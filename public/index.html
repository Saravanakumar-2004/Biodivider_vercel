<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carbelim | Data Engine</title>
  <style>
    :root {
      --bg-main: #f7f7f8;
      --bg-card: #ffffff;
      --text-main: #353740;
      --text-muted: #6e6e80;
      --border: #e5e7eb;
      --brand: #10a37f;
      --brand-hover: #1a7f64;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: Söhne, ui-sans-serif, system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 2rem 1rem;
    }

    .container { max-width: 900px; margin: 0 auto; }
    
    .header { text-align: center; margin-bottom: 2rem; }
    .header h1 { font-size: 1.5rem; font-weight: 600; margin: 0; color: #202123; }
    .header p { color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .form-row { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 1rem; 
      margin-bottom: 1rem; 
    }
    
    .form-group { 
      flex: 1; 
      min-width: 70px; 
      display: flex; 
      flex-direction: column; 
    }
    
    label { 
      font-size: 0.8rem; 
      font-weight: 500; 
      margin-bottom: 0.4rem; 
      color: var(--text-main); 
    }
    
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 0.3rem;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    
    input:focus { 
      border-color: var(--brand); 
    }
    .live-preview { display: flex; justify-content: space-around; margin: 2rem 0; text-align: center; }
    .val-box h3 { font-size: 0.85rem; color: var(--text-muted); margin: 0 0 0.5rem 0; font-weight: 500; }
    .val-box .val { font-size: 3rem; font-weight: 700; color: var(--text-main); letter-spacing: -1px; }

    .btn {
      background: var(--brand);
      color: white;
      border: none;
      padding: 0.7rem 1rem;
      border-radius: 0.3rem;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    .btn:hover { background: var(--brand-hover); }
    
    .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border); margin-top: 1rem; }
    .btn-outline:hover { background: var(--bg-main); }

    .url-box, pre {
      background: var(--bg-main);
      padding: 1rem;
      border-radius: 0.3rem;
      border: 1px solid var(--border);
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 0.85rem;
      color: var(--text-main);
      overflow-x: auto;
      word-break: break-all;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Carbelim Pvt Limited</h1>
    <p>Data Stream Engine</p>
  </div>

  <div class="grid">
    <div class="card">
      <h2>CO₂ Parameters (Grams)</h2>
      <div class="form-row">
        <div class="form-group">
          <label>Interval (sec)</label>
          <input type="number" id="co2Interval" value="5" min="0.5" step="0.5" />
        </div>
        <div class="form-group">
          <label>Start Value</label>
          <input type="number" id="co2Start" value="0" step="1" />
        </div>
        <div class="form-group">
          <label>Step Increment</label>
          <input type="number" id="co2Step" value="5" step="1" />
        </div>
      </div>

      <h2 style="margin-top: 1.5rem;">O₂ Parameters (Litres)</h2>
      <div class="form-row">
        <div class="form-group">
          <label>Interval (sec)</label>
          <input type="number" id="o2Interval" value="5" min="0.5" step="0.5" />
        </div>
        <div class="form-group">
          <label>Start Value</label>
          <input type="number" id="o2Start" value="0" step="1" />
        </div>
        <div class="form-group">
          <label>Step Increment</label>
          <input type="number" id="o2Step" value="10" step="1" />
        </div>
      </div>
      
      <button class="btn" onclick="syncParameters()">Update Engine URL</button>
    </div>

    <div class="card">
      <h2>Live Stream Preview</h2>
      <div class="live-preview">
        <div class="val-box">
          <h3>CO₂ Output</h3>
          <div class="val" id="dispCo2">0g</div>
        </div>
        <div class="val-box">
          <h3>O₂ Output</h3>
          <div class="val" id="dispO2">0l</div>
        </div>
      </div>
      <button class="btn btn-outline" onclick="exportStaticJson()">Download Static JSON Batch</button>
    </div>
  </div>

  <div class="card">
    <h2>Huidu HDPlayer Dynamic Link</h2>
    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem;">
      Apply this link as your HTTP/Web API Data Source in HDPlayer.
    </p>
    <div class="url-box" id="apiUrlBox">Generating link...</div>
    <button class="btn btn-outline" style="width: auto;" onclick="copyUrl()">Copy URL</button>
  </div>

  <div class="card" style="margin-top: 1.5rem;">
    <h2>JSON Payload Response</h2>
    <pre id="jsonPreview">{}</pre>
  </div>
</div>

<script>
  let startTime = Date.now();

  function getQueryUrl() {
    const co2Int = document.getElementById('co2Interval').value;
    const co2Start = document.getElementById('co2Start').value;
    const co2Step = document.getElementById('co2Step').value;
    
    const o2Int = document.getElementById('o2Interval').value;
    const o2Start = document.getElementById('o2Start').value;
    const o2Step = document.getElementById('o2Step').value;

    const base = window.location.origin;
    return `${base}/api/display-data?co2_interval=${co2Int}&co2_start=${co2Start}&co2_step=${co2Step}&o2_interval=${o2Int}&o2_start=${o2Start}&o2_step=${o2Step}&epoch=${startTime}`;
  }

  function syncParameters() {
    startTime = Date.now();
    const url = getQueryUrl();
    document.getElementById('apiUrlBox').innerText = url;
    fetchData();
  }

  async function fetchData() {
    try {
      const url = getQueryUrl();
      const res = await fetch(url);
      const data = await res.json();
      
      document.getElementById('dispCo2').innerText = data.co2_formatted;
      document.getElementById('dispO2').innerText = data.o2_formatted;
      document.getElementById('jsonPreview').innerText = JSON.stringify(data, null, 2);
    } catch (e) {
      console.error(e);
    }
  }

  function copyUrl() {
    const text = document.getElementById('apiUrlBox').innerText;
    navigator.clipboard.writeText(text);
    alert('Dynamic URL copied to clipboard.');
  }

  function exportStaticJson() {
    const cInt = parseFloat(document.getElementById('co2Interval').value);
    const cStart = parseFloat(document.getElementById('co2Start').value);
    const cStep = parseFloat(document.getElementById('co2Step').value);
    
    const oInt = parseFloat(document.getElementById('o2Interval').value);
    const oStart = parseFloat(document.getElementById('o2Start').value);
    const oStep = parseFloat(document.getElementById('o2Step').value);

    const sequence = [];
    // Simulates a 100-second timeline running at 1-second ticks
    for (let sec = 0; sec <= 100; sec++) {
      const cStepCount = Math.floor(sec / cInt);
      const oStepCount = Math.floor(sec / oInt);
      sequence.push({
        timeline_second: sec,
        co2_raw: Number((cStart + cStepCount * cStep).toFixed(2)),
        o2_raw: Number((oStart + oStepCount * oStep).toFixed(2))
      });
    }

    const blob = new Blob([JSON.stringify(sequence, null, 2)], { type: 'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'carbelim_batch_data.json';
    link.click();
  }

  window.onload = () => {
    document.getElementById('apiUrlBox').innerText = getQueryUrl();
    setInterval(fetchData, 1000);
  };
</script>
</body>
</html>
